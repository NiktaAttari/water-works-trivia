<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b2b"><title>Water Works Trivia</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="shell"><header><div class="brand"><div class="mark"><span></span></div><div><p class="eyebrow">INDUSTRY GAME NIGHT</p><h1>Water Works Trivia</h1></div></div><div class="host-pill">HOST CONSOLE</div></header>
<nav class="roundbar"><div><small>CURRENT ROUND</small><strong id="roundName">Mixed Waterworks</strong></div><div class="round-actions"><button id="shuffleBtn" class="ghost">SHUFFLE DECK</button><button id="resetBtn" class="danger">RESET GAME</button></div></nav>
<main class="layout"><section class="stage panel"><div class="meta"><span id="category" class="category"></span><span id="difficulty"></span><span id="counter"></span></div><div class="progress"><i id="progress"></i></div><div class="question-wrap"><div class="number" id="bigNumber">01</div><h2 id="question"></h2></div><div class="answer" id="answer"><small>ANSWER</small><strong id="answerText"></strong></div><div class="controls"><button id="revealBtn" class="control reveal"><span>REVEAL</span><small>Show answer</small></button><button id="awardBtn" class="control award"><span>AWARD</span><small>Point to selected team</small></button><button id="skipBtn" class="control skip"><span>SKIP</span><small>Mark unanswered</small></button><button id="nextBtn" class="control next"><span>NEXT</span><small>Advance question</small></button></div></section>
<aside class="side"><section class="panel leaderboard"><div class="section-title"><div><small>LIVE RESULTS</small><h3>Leaderboard</h3></div><button id="hideScores" class="iconbtn" title="Hide scores">HIDE</button></div><div id="teams"></div><form id="teamForm"><input id="teamName" maxlength="28" placeholder="Add a team name" aria-label="Team name"><button>ADD TEAM</button></form></section>
<section class="panel stats"><div class="section-title"><div><small>GAME PROGRESS</small><h3>Round dashboard</h3></div></div><div class="statgrid"><div><b id="answeredStat">0</b><span>Answered</span></div><div><b id="pointsStat">0</b><span>Points</span></div><div><b id="remainingStat">0</b><span>Remaining</span></div></div><div class="donut-row"><div class="donut" id="donut"><span id="percent">0%</span></div><div><strong>Completion</strong><p id="statusLine">Ready for the first question.</p></div></div></section></aside></main>
<footer><span>Designed for water and wastewater professionals</span><span id="saveStatus">Saved on this device</span></footer></div><div id="toast" aria-live="polite"></div><script src="app.js"></script></body></html>
